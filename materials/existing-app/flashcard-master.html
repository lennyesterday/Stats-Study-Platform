<title>Flash Card Master New Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one study column; an index card in the middle, confidence buttons under it, explanations unfold below. */
:root {
  --paper: #eef2f8; --surface: #ffffff; --ink: #141c33; --muted: #58627c; --line: #d8dfeb;
  --rule: #e4ebf7; --margin: #f1b8b8;
  --accent: #2c4fe0; --accent-ink: #ffffff; --accent-soft: #e5ebff;
  --again: #c93a33; --hard: #b87300; --good: #16865a; --easy: #2c4fe0;
  --again-soft: #fbe7e5; --hard-soft: #fbf0d9; --good-soft: #def3ea; --easy-soft: #e5ebff;
  --shadow: 0 1px 2px rgba(20,28,51,.06), 0 8px 28px rgba(20,28,51,.08);
  --img-bg: #ffffff;
  --marker: #fff0a0;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1220; --surface: #161d2f; --ink: #e6ebf6; --muted: #98a3bc; --line: #2a3350;
  --rule: #1f2840; --margin: #5a2c33;
  --accent: #7f9bff; --accent-ink: #0d1220; --accent-soft: #1e2a52;
  --again: #ff7b72; --hard: #f0b94a; --good: #4fd19a; --easy: #8ea8ff;
  --again-soft: #3a1c1e; --hard-soft: #352a12; --good-soft: #14322a; --easy-soft: #1e2a52;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --marker: #5e4f12;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0d1220; --surface: #161d2f; --ink: #e6ebf6; --muted: #98a3bc; --line: #2a3350;
  --rule: #1f2840; --margin: #5a2c33;
  --accent: #7f9bff; --accent-ink: #0d1220; --accent-soft: #1e2a52;
  --again: #ff7b72; --hard: #f0b94a; --good: #4fd19a; --easy: #8ea8ff;
  --again-soft: #3a1c1e; --hard-soft: #352a12; --good-soft: #14322a; --easy-soft: #1e2a52;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --marker: #5e4f12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: .9rem; }
.sub-btn { border: 0; background: none; padding: 0; color: var(--muted); font-size: .9rem; }
.sub-btn:hover { color: var(--ink); text-decoration: underline dotted; }
.sub-btn:disabled { cursor: default; text-decoration: none; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; color: var(--muted); font-weight: 700; font-size: .92rem; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.decks { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: .88rem; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.stats { display: flex; gap: 14px; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.stats b { font-weight: 500; color: var(--ink); font-size: .95rem; margin-right: 3px; }
.stats .due b { color: var(--again); }
.stats .new b { color: var(--accent); }
.stats .mastered b { color: var(--good); }

/* the index card */
.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.card { position: relative; background: var(--surface); border-radius: 6px; box-shadow: var(--shadow);
  min-height: 300px; padding: 28px 28px 24px 56px; display: flex; flex-direction: column; gap: 14px;
  background-image: linear-gradient(to right, transparent 40px, var(--margin) 40px, var(--margin) 41px, transparent 41px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  background-position: 0 0, 0 60px; cursor: pointer; }
.card.flipped { cursor: default; }
.card .meta { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card .q { font-family: var(--f-display); font-weight: 500; font-size: clamp(1.3rem, 3.6vw, 1.75rem); line-height: 1.3; }
.card .a { white-space: pre-line; font-size: 1.05rem; border-top: 1px dashed var(--line); padding-top: 14px; }
.card .hint { margin-top: auto; color: var(--muted); font-size: .9rem; display: flex; gap: 8px; align-items: center; }
kbd { font-family: var(--f-mono); font-size: .75rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--paper); }
.card .tools { position: absolute; top: 18px; right: 18px; display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 9px; font-size: .8rem; color: var(--muted); }
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.card .meta { padding-right: 70px; }

/* confidence */
.rate-label { font-size: .9rem; color: var(--muted); text-align: center; }
.rates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { border: 1px solid transparent; border-radius: 10px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; }
.rate small { font-family: var(--f-mono); font-weight: 500; font-size: .74rem; opacity: .85; }
.rate .k { font-family: var(--f-mono); font-size: .68rem; font-weight: 500; opacity: .6; }
.rate.again { background: var(--again-soft); color: var(--again); }
.rate.hard { background: var(--hard-soft); color: var(--hard); }
.rate.good { background: var(--good-soft); color: var(--good); }
.rate.easy { background: var(--easy-soft); color: var(--easy); }
.rate:hover { border-color: currentColor; }
.show-btn { width: 100%; padding: 13px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; }

/* learn more */
.more { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.more-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.more-tabs button { flex: 1 1 auto; border: 0; background: none; padding: 11px 12px; font-weight: 700; font-size: .9rem; color: var(--muted); border-bottom: 2px solid transparent; }
.more-tabs button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.more-body { padding: 16px 18px 18px; white-space: pre-line; }
.more-body.empty { color: var(--muted); font-style: italic; }
.ask { display: flex; flex-direction: column; gap: 10px; }
.ask-row { display: flex; flex-wrap: wrap; gap: 6px; }
.ask-row button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font-size: .86rem; }
.ask-row button:hover { border-color: var(--accent); color: var(--accent); }
.ask form { display: flex; gap: 6px; }
.ask input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 10px; }
.ask .go { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 14px; font-weight: 700; }
.answer { white-space: normal; border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; }
.answer p { margin: 0 0 .6em; } .answer ul { margin: 0 0 .6em; padding-left: 1.2em; }
.answer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.note { font-size: .85rem; color: var(--muted); }

/* done state */
.done { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 32px 28px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.done h2 { font-size: 1.5rem; }
.done p { margin: 0; color: var(--muted); max-width: 60ch; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 16px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--again); border-color: var(--again); background: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* card list */
.list-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 44px 10px 14px; font-size: 1rem; }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search input:not(:placeholder-shown) + kbd { display: none; }
mark { background: var(--hard-soft); color: var(--ink); border-radius: 3px; padding: 0 1px; }
.search-info { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; flex: 1 1 auto; min-width: 0; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; text-decoration: underline; }
.list-tools input { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 12px; }
.list { display: flex; flex-direction: column; gap: 22px; }
.group-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.group h3 { font-size: 1rem; color: var(--muted); font-weight: 500; }
.add-chip { border: 1px dashed var(--accent); color: var(--accent); background: none; padding: 4px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; }
.add-chip:hover { background: var(--accent-soft); }
.items { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .t { min-width: 0; }
.item .t div:first-child { font-weight: 700; }
.item .t div:last-child { color: var(--muted); font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-family: var(--f-mono); font-size: .7rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.new { background: var(--accent-soft); color: var(--accent); }
.pill.learning { background: var(--hard-soft); color: var(--hard); }
.pill.due { background: var(--again-soft); color: var(--again); }
.pill.review { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.pill.mastered { background: var(--good-soft); color: var(--good); }

/* editor */
.scrim { position: fixed; inset: 0; background: rgba(10,14,26,.45); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 20;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.editor { background: var(--surface); border-radius: 14px; width: 100%; max-width: 640px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.editor label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: .88rem; }
.editor label span { font-weight: 400; color: var(--muted); }
.editor textarea, .editor input, .editor select { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; font-weight: 400; font-size: .95rem; resize: vertical; }
.editor .split { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.status { font-size: .88rem; color: var(--muted); min-height: 1.3em; }
/* answer in your own words */
.own { display: flex; flex-direction: column; gap: 6px; }
.own textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 1rem; line-height: 1.5; resize: vertical; min-height: 5em; }
.own textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.mic[aria-pressed="true"] { background: var(--again-soft); color: var(--again); border-color: var(--again); }
.own select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: .86rem; }
.own-fb { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.own-yours { display: flex; flex-direction: column; gap: 4px; }
.own-yours div { white-space: pre-line; border-left: 3px solid var(--line); padding-left: 10px; }
.verdict-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.verdict { font-weight: 700; border-radius: 999px; padding: 3px 12px; font-size: .88rem; }
.verdict.correct { background: var(--good-soft); color: var(--good); }
.verdict.partial { background: var(--hard-soft); color: var(--hard); }
.verdict.missing { background: var(--again-soft); color: var(--again); }
.ideas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ideas li { display: flex; gap: 8px; align-items: baseline; }
.ideas .mk { font-family: var(--f-mono); font-weight: 700; flex: none; }
.ideas .yes .mk { color: var(--good); }
.ideas .no .mk { color: var(--again); }
.own-fb .fb-text { margin: 0; }
.rate.suggested { border-color: currentColor; box-shadow: inset 0 0 0 1px currentColor; }
.rate .sug { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; }
/* mock exam */
.exam { display: flex; flex-direction: column; gap: 14px; }
.exam-home { display: flex; flex-direction: column; gap: 18px; }
.exam-home h2 { font-size: 1.3rem; }
.exam-home h3 { font-size: 1rem; }
.exam-home .intro p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }
.ex-head, .ex-score { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.ex-head h2 { font-size: 1.2rem; }
.ex-head p { margin: 2px 0 0; }
.ex-score .big { font-family: var(--f-display); font-size: 3rem; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.ex-score .big span { font-size: 1.4rem; color: var(--muted); }
.ex-score .sum { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.ex-score h2 { font-size: 1.3rem; }
.exq { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.exq.ok { border-left-color: var(--good); }
.exq.bad { border-left-color: var(--again); }
.exq-stem, .exq-q { margin: 0; }
.exq-q { font-weight: 700; }
.exq-opts { display: flex; flex-direction: column; gap: 6px; }
.exq-opt { display: flex; gap: 10px; text-align: left; align-items: flex-start; border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 9px 12px; width: 100%; }
.exq-opt:hover:not(:disabled) { border-color: var(--accent); }
.exq-opt:disabled { cursor: default; color: inherit; }
.exq-opt .ltr { font-family: var(--f-mono); font-weight: 500; color: var(--muted); }
.exq-opt.picked { border-color: var(--accent); background: var(--accent-soft); }
.exq-opt.correct { border-color: var(--good); background: var(--good-soft); }
.exq-opt.wrong { border-color: var(--again); background: var(--again-soft); }
.exq-fb { white-space: pre-line; background: var(--paper); border-radius: 9px; padding: 10px 12px; font-size: .95rem; }
.exq-cards { display: flex; flex-direction: column; gap: 6px; }
.exq-card { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; border: 1px dashed var(--line); border-radius: 9px; padding: 8px 10px; }
.btn.flagged { background: var(--hard-soft); color: var(--hard); border-color: var(--hard); }
.pill.flag { background: var(--hard-soft); color: var(--hard); margin-left: 6px; }
.flag-box { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--hard-soft); border-radius: 10px; padding: 10px 14px; }
.exam-row .row { justify-content: flex-end; }
/* text formatting */
mark.hi { background: var(--marker); color: var(--ink); border-radius: 3px; padding: 0 2px; }
.fmt-bar { position: sticky; top: -22px; z-index: 2; background: var(--surface); margin: -6px 0 0; padding-block: 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.fmt-tools { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.fmt-tools button { min-width: 34px; height: 32px; border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 0 9px; font-size: .9rem; }
.fmt-tools button:hover { border-color: var(--accent); color: var(--accent); }
.fmt-tools .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.fmt-preview { font-size: .9rem; color: var(--muted); white-space: pre-line; max-height: 5.5em; overflow: auto; }
.fmt-preview b { color: var(--ink); }
/* session builder */
.session { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 12px; font-weight: 700; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.levels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lvl { border: 1px solid transparent; border-radius: 999px; padding: 4px 12px; font-size: .86rem; font-weight: 700; opacity: .5; }
.lvl.again { background: var(--again-soft); color: var(--again); }
.lvl.hard { background: var(--hard-soft); color: var(--hard); }
.lvl.good { background: var(--good-soft); color: var(--good); }
.lvl.easy { background: var(--easy-soft); color: var(--easy); }
.lvl[aria-pressed="true"] { opacity: 1; border-color: currentColor; }
.lvl.st-due { background: var(--again-soft); color: var(--again); }
.lvl.st-new { background: var(--accent-soft); color: var(--accent); }
.lvl.st-learning { background: var(--hard-soft); color: var(--hard); }
.lvl.st-review { background: var(--paper); color: var(--muted); border-color: var(--line); }
.lvl.st-mastered { background: var(--good-soft); color: var(--good); }
.stats button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.stats button:hover { text-decoration: underline; }
.lvl b { font-family: var(--f-mono); font-weight: 500; margin-left: 4px; }
.session-opts { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: .9rem; }
.session-opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
/* AI suggestions in the editor */
.ed-ai { border-top: 1px dashed var(--line); padding-top: 12px; }
#ai-out, #ai-dia { display: flex; flex-direction: column; gap: 8px; }
.ai-overall { margin: 0; font-style: italic; }
.ai-sug { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; background: var(--paper); min-width: 0; }
.ai-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ai-text { white-space: pre-line; border-left: 3px solid var(--accent); padding-left: 10px; font-size: .92rem; }
.ai-fig { margin: 0; background: var(--img-bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.ai-fig img { display: block; width: 100%; height: auto; }
/* slide images */
.card-imgs { display: flex; flex-direction: column; gap: 10px; }
.card-img { margin: 0; background: var(--img-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: zoom-in; }
.card-img img { display: block; width: 100%; height: auto; border-radius: 4px; }

<script>
const MIN = 60e3, DAY = 864e5;
const S = { cards: [], prog: {}, decks: loadDecks(), view: "study", queue: [], cur: null, flipped: false,
  practice: false, done: 0, total: 0, canWrite: true, db: null, uid: null, sample: null,
  cardsLoaded: false, progLoaded: false, started: false, moreTab: "simple", ask: null, search: "", confirmReset: false,
  proposals: [], propLoaded: false, openProp: {}, showRejected: false, reviewMsg: "", busy: new Set(),
  session: loadSession(), edImages: [], aiSugs: [], aiSvg: "", aiIdea: "", own: {}, grade: null,
  ex: { official: [], mine: [], attempts: {}, cur: null, answers: [], mode: "exam", submitted: false, armSubmit: false, gen: null, scope: "full", decks: [], count: 10, level: "hard", msg: "" },
  flags: new Set(), st: {}, course: "",
  cs: { sub: "concepts", open: null, drafts: {}, results: {}, chat: [], chatBusy: false, busy: null, msg: "", loaded: false, loading: false, chatDraft: "", clearArm: false,
    mem: false, sols: [], solTask: "b1", solCustom: "", pick: [], solBusy: null, solOpen: null, solAll: false, solDel: null, solsLoaded: false } };
const LEVELS = ["No idea", "Shaky", "Got it", "Easy"];
const COURSE = () => S.course || "this course";
function loadSession() {
  const d = { mode: "due", levels: [1, 2], statuses: ["due"], shuffle: false, count: true };
  try { return { ...d, ...JSON.parse(localStorage.getItem("fcm-session") || "{}") }; } catch { return d; }
}
function loadDecks() { try { const d = JSON.parse(localStorage.getItem("fcm-decks") || "[]"); return Array.isArray(d) ? d : []; } catch { return []; } }
function saveDecks() { try { localStorage.setItem("fcm-decks", JSON.stringify(S.decks)); } catch {} }
const isAll = () => { const ds = decks(); return !S.decks.some((d) => ds.includes(d)); };
const deckOn = (name) => isAll() || S.decks.includes(name);
const singleDeck = () => { const on = decks().filter((d) => S.decks.includes(d)); return on.length === 1 ? on[0] : null; };
function deckLabel() {
  if (isAll()) return "all weeks";
  const ds = decks().filter((d) => S.decks.includes(d));
  const m = ds.map((d) => d.match(/^(Lecture|Week) (\d+)$/) || []), nums = m.map((x) => x[2]);
  if (ds.length > 1 && nums.every(Boolean) && m.every((x) => x[1] === m[0][1])) return m[0][1] + "s " + nums.slice(0, -1).join(", ") + " & " + nums[nums.length - 1];
  return ds.join(" + ");
}
function toggleDeck(d) {
  if (d === "all") S.decks = [];
  else S.decks = S.decks.includes(d) ? S.decks.filter((x) => x !== d) : [...S.decks, d];
  if (S.decks.length && decks().every((x) => S.decks.includes(x))) S.decks = [];  // every week picked = all
  saveDecks();
}
function saveSession() { try { localStorage.setItem("fcm-session", JSON.stringify(S.session)); } catch {} }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- scheduling (SM-2 style, with short learning steps) ---------- */
function nextState(p, r) {
  const now = Date.now();
  p = { ease: 2.5, interval: 0, step: 0, reps: 0, lapses: 0, prev: 0, ...(p || {}) };
  const out = { ...p, reps: p.reps + 1, last: r, lastAt: now };
  if (p.interval === 0) {               // new or relearning
    const grad = p.prev ? Math.max(1, Math.round(p.prev * 0.5)) : 1;
    if (r === 1) { out.step = 0; out.due = now + 1 * MIN; }
    else if (r === 2) { out.due = now + 6 * MIN; }
    else if (r === 3) {
      if (p.step >= 1) { out.interval = grad; out.due = now + grad * DAY; out.step = 0; }
      else { out.step = 1; out.due = now + 10 * MIN; }
    } else { const iv = Math.max(4, grad + 2); out.interval = iv; out.due = now + iv * DAY; out.step = 0; }
  } else {                              // graduated review
    const iv = p.interval;
    if (r === 1) { out.lapses = p.lapses + 1; out.ease = Math.max(1.3, p.ease - 0.2); out.prev = iv; out.interval = 0; out.step = 0; out.due = now + 10 * MIN; }
    else if (r === 2) { out.ease = Math.max(1.3, p.ease - 0.15); out.interval = Math.max(iv + 1, Math.round(iv * 1.2)); }
    else if (r === 3) { out.interval = Math.max(iv + 1, Math.round(iv * p.ease)); }
    else { out.ease = p.ease + 0.15; out.interval = Math.max(iv + 2, Math.round(iv * p.ease * 1.3)); }
    if (r > 1) out.due = now + out.interval * DAY;
  }
  return out;
}
function fmtIv(ms) {
  if (ms < 60 * MIN) return Math.max(1, Math.round(ms / MIN)) + " min";
  if (ms < DAY) return Math.round(ms / (60 * MIN)) + " h";
  const d = Math.round(ms / DAY);
  if (d < 31) return d + (d === 1 ? " day" : " days");
  return (d / 30).toFixed(1).replace(".0", "") + " mo";
}
function status(id) {
  const p = S.prog[id];
  if (!p) return { k: "new", label: "New" };
  if (p.due <= Date.now()) return { k: "due", label: "Due now" };
  if (p.interval === 0) return { k: "learning", label: "Learning · " + fmtIv(p.due - Date.now()) };
  if (p.interval >= 21) return { k: "mastered", label: "Mastered · " + fmtIv(p.due - Date.now()) };
  return { k: "review", label: "Review in " + fmtIv(p.due - Date.now()) };
}

const STATUSES = [["due", "Due"], ["new", "New"], ["learning", "Learning"], ["review", "Reviewing"], ["mastered", "Mastered"]];
function hasStatus(id, k) {
  const p = S.prog[id], now = Date.now();
  if (k === "new") return !p;
  if (!p) return false;
  if (k === "due") return p.due <= now;
  if (k === "mastered") return p.interval >= 21;
  if (k === "learning") return p.due > now && p.interval === 0;
  return p.due > now && p.interval > 0 && p.interval < 21;
}

/* ---------- data ---------- */
const decks = () => [...new Set(S.cards.map((c) => c.deck))];
const inDeck = () => S.cards.filter((c) => deckOn(c.deck));
const card = (id) => S.cards.find((c) => c.id === id);

function shuffleIds(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildQueue(practice = false) {
  const now = Date.now(), list = inDeck(), ss = S.session;
  let ids;
  S.straight = !practice && (ss.mode === "straight" || ss.mode === "random");
  S.stRun = !practice && ss.mode === "straight";
  if (practice) { S.practice = true; ids = shuffleIds(list.map((c) => c.id)); }
  else {
    S.practice = !ss.count;
    if (ss.mode === "flagged") {
      ids = S.cards.filter((c) => S.flags.has(c.id)).map((c) => c.id);
    } else if (ss.mode === "weak") {
      ids = list.filter((c) => S.prog[c.id] && ss.levels.includes(S.prog[c.id].last))
        .sort((a, b) => S.prog[a.id].last - S.prog[b.id].last || (S.prog[b.id].lapses || 0) - (S.prog[a.id].lapses || 0)).map((c) => c.id);
    } else if (ss.mode === "status") {
      const rank = (c) => STATUSES.findIndex(([k]) => ss.statuses.includes(k) && hasStatus(c.id, k));
      ids = list.filter((c) => rank(c) >= 0)
        .sort((a, b) => rank(a) - rank(b) || (S.prog[a.id]?.due || 0) - (S.prog[b.id]?.due || 0)).map((c) => c.id);
    } else if (ss.mode === "random") {
      S.practice = true; ids = shuffleIds(list.map((c) => c.id));
    } else if (ss.mode === "straight") {
      S.practice = true; ids = list.map((c) => c.id);
    } else if (ss.mode === "all") {
      ids = list.map((c) => c.id);
    } else {
      const due = list.filter((c) => S.prog[c.id] && S.prog[c.id].due <= now).sort((a, b) => S.prog[a.id].due - S.prog[b.id].due);
      const fresh = list.filter((c) => !S.prog[c.id]);
      ids = [...due, ...fresh].map((c) => c.id);
    }
    if (ss.shuffle) shuffleIds(ids);
  }
  S.queue = ids;
  S.done = 0; S.total = S.queue.length; S.cur = S.queue[0] || null; S.flipped = false; S.ask = null; S.moreTab = "simple";
  S.started = true;
}
function startCustom(ids) {

/* ---------- study actions ---------- */
function flip() { if (!S.cur || S.flipped) return; S.flipped = true; render(); }
function rate(r) {
  if (!S.cur || !S.flipped) return;
  const id = S.cur;
  gradeCtl?.abort(); S.grade = null; delete S.own[id];
  S.queue.shift();
  if (S.stRun) { S.st[id] = r; saveSt(); }
  if (!S.practice) {
    const p = nextState(S.prog[id], r);
    saveProg(id, p);
    if (!S.straight && p.due - Date.now() < 20 * MIN) {          // still learning: bring it back this session
      S.queue.splice(Math.min(S.queue.length, r === 1 ? 2 : 4), 0, id);
      S.total++;
    }
  } else if (r === 1 && !S.straight) { S.queue.splice(Math.min(S.queue.length, 3), 0, id); S.total++; }
  S.done++;
  S.cur = S.queue[0] || null; S.flipped = false; S.ask = null; S.moreTab = "simple";
  render();
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const DICT_LANGS = [["en-US", "English"], ["de-DE", "Deutsch"], ["pt-PT", "Português"]];
let dict = null;
function dictLang() { try { return localStorage.getItem("fcm-dictlang") || "en-US"; } catch { return "en-US"; } }
function dictMsg(t) { if ($("own-msg")) $("own-msg").textContent = t; }
function dictUi() { const b = $("own-mic"); if (b) { b.setAttribute("aria-pressed", !!dict); b.textContent = dict ? "■ Stop dictating" : "🎤 Dictate"; } }
function stopDictation() { if (dict) { try { dict.rec.stop(); } catch {} } }
function startDictation() {
  const id = S.cur; if (!SR || !id || dict) return;
  const rec = new SR(), base = (S.own[id] || "").trim();
  rec.lang = dictLang(); rec.continuous = true; rec.interimResults = true;
  dict = { rec, id };
  rec.onresult = (e) => {
    let said = "";
    for (let i = 0; i < e.results.length; i++) said += e.results[i][0].transcript;
    S.own[id] = (base ? base + " " : "") + said.trim();
    const ta = $("own");
    if (ta && S.cur === id) { ta.value = S.own[id]; ta.scrollTop = ta.scrollHeight; } else rec.stop();
  };
  rec.onerror = (e) => {
    const m = { "not-allowed": "Microphone access is blocked here. Allow it in your browser, or use your computer's dictation (Mac: press the Fn/🌐 key twice).",
      "service-not-allowed": "Dictation isn't allowed in this view. Use your computer's dictation instead (Mac: press the Fn/🌐 key twice).",
      "no-speech": "I didn't hear anything. Try again.", "audio-capture": "No microphone found.", network: "Dictation needs an internet connection." }[e.error];
    if (m) dictMsg(m);
  };
  rec.onend = () => { if (dict?.rec === rec) dict = null; dictUi(); };
  try { rec.start(); dictUi(); dictMsg("Listening… speak your answer."); }
  catch { dict = null; dictUi(); dictMsg("Dictation couldn't start. Use your computer's dictation instead (Mac: press the Fn/🌐 key twice)."); }
}

/* ---------- language help ---------- */
function langSpec(full) {
  return `"language":{"tips":["1 to 3 general tips for writing this kind of answer better in English"],"fixes":[{"from":"the student's exact words","to":"a clearer, more precise or more professional version","why":"short reason in simple English"}]${full ? `,"better":"the student's whole answer rewritten in clear, precise, exam-ready English, keeping their ideas, adding nothing new and staying about the same length"` : ""}}`;
}
const LANG_RULES = `LANGUAGE HELP: English is not the student's first language. Separately from the content, help them get their point across better in English: clarity, precise word choice, the course's own terminology, a professional academic/business register, concise sentences and good linking words (therefore, whereas, as a result). Give the 3 to 6 most valuable fixes, quoting the student's exact words in "from"; skip trivial nitpicks, but always correct real grammar or vocabulary errors. Keep "why" short and in simple English. Judge content and language separately: language must not change the content score.`;
function cleanLang(L) {
  const str = (x) => typeof x === "string" ? x.trim() : "";
  if (!L || typeof L !== "object") return null;
  const fixes = (Array.isArray(L.fixes) ? L.fixes : []).map((f) => ({ from: str(f?.from), to: str(f?.to), why: str(f?.why) })).filter((f) => f.from && f.to && f.from !== f.to).slice(0, 8);
  const tips = (Array.isArray(L.tips) ? L.tips : []).map(str).filter(Boolean).slice(0, 3), better = str(L.better);
  return fixes.length || tips.length || better ? { fixes, tips, better } : null;
}
function langHtml(L) {
  if (!L) return "";
  return `<div class="lang-fb"><div class="prop-meta">Language: getting your point across</div>
    ${L.fixes.length ? `<ul class="lang-fixes">${L.fixes.map((f) => `<li><span class="lang-from">${esc(f.from)}</span><span class="lang-arrow" aria-hidden="true">→</span><span class="lang-to">${esc(f.to)}</span>${f.why ? `<span class="note">${esc(f.why)}</span>` : ""}</li>`).join("")}</ul>` : ""}
    ${L.tips.length ? `<ul class="lang-tips">${L.tips.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    ${L.better ? `<details class="lang-better"><summary>Your answer in stronger English</summary><div class="answer">${md(L.better)}</div></details>` : ""}</div>`;
}

/* ---------- answer in your own words ---------- */
let gradeCtl = null;
function ownFeedbackHtml(c) {
  const own = (S.own[c.id] || "").trim(), G = S.grade && S.grade.id === c.id ? S.grade : null;
  if (!own && !G) return "";
  let body = "";
  if (!G) body = S.sample ? `<div><button class="btn" id="own-check">Get feedback on my answer</button></div>` : `<div class="note">Compare your answer with the card above.</div>`;
  else if (G.busy) body = `<div class="note">Checking your answer against the key ideas of this card… <button class="icon-btn" id="own-stop">Stop</button></div>`;
  else if (G.error) body = `<div class="note">${esc(G.error)}</div>${own ? `<div><button class="btn" id="own-check">Try again</button></div>` : ""}`;
  else {
    const r = G.result, label = { correct: "Spot on", partial: "Partly there", missing: "Key ideas missing" }[r.verdict];
    body = `<div class="prop-meta">Content</div><div class="verdict-row"><span class="verdict ${r.verdict}">${label}</span>${Number.isFinite(r.score) ? `<span class="note">${r.score}% of the essence</span>` : ""}</div>
      ${r.keyIdeas.length ? `<div><div class="prop-meta" style="margin-bottom:4px">Key ideas</div><ul class="ideas">${r.keyIdeas.map((k) => `<li class="${k.covered ? "yes" : "no"}"><span class="mk" aria-label="${k.covered ? "covered" : "missing"}">${k.covered ? "✓" : "✗"}</span><span>${esc(k.idea)}</span></li>`).join("")}</ul></div>` : ""}
      ${r.errors.length ? `<div><div class="prop-meta" style="margin-bottom:4px">Not quite right</div><ul class="ideas">${r.errors.map((x) => `<li class="no"><span class="mk">!</span><span>${esc(x)}</span></li>`).join("")}</ul></div>` : ""}
      ${r.feedback ? `<p class="fb-text">${esc(r.feedback)}</p>` : ""}
      ${r.suggestedRating ? `<div class="note">Suggested rating: <b>${LEVELS[r.suggestedRating - 1]}</b>. You decide below.</div>` : ""}
      ${langHtml(r.lang)}`;
  }
  return `<section class="own-fb" aria-label="Feedback on your answer"><div class="own-yours"><span class="prop-meta">Your answer</span><div>${own ? esc(own) : "(empty)"}</div></div>${body}</section>`;
}
function cleanGrade(r) {
  const score = Math.max(0, Math.min(100, Math.round(Number(r?.score))));
  let verdict = ["correct", "partial", "missing"].includes(r?.verdict) ? r.verdict : null;
  if (!verdict) verdict = score >= 85 ? "correct" : score >= 45 ? "partial" : "missing";
  const sr = Math.round(Number(r?.suggestedRating));
  return {
    verdict, score: Number.isFinite(score) ? score : null,
    keyIdeas: (Array.isArray(r?.keyIdeas) ? r.keyIdeas : []).filter((k) => k && k.idea).slice(0, 8).map((k) => ({ idea: String(k.idea), covered: !!k.covered })),
    errors: (Array.isArray(r?.errors) ? r.errors : []).filter(Boolean).slice(0, 5).map(String),
    feedback: String(r?.feedback || ""),
    suggestedRating: sr >= 1 && sr <= 4 ? sr : null,
    lang: cleanLang(r?.language),
  };
}
async function checkOwn() {
  const c = card(S.cur); if (!c || !S.sample) return;
  const own = (S.own[c.id] || "").trim();
  if (!own) { if ($("own-msg")) $("own-msg").textContent = "Write your answer first."; $("own")?.focus(); return; }
  gradeCtl?.abort(); gradeCtl = new AbortController();
  S.grade = { id: c.id, busy: true }; S.flipped = true; render();
  const prompt = `You are a strict but fair university tutor checking a student's flash-card answer for the course "${COURSE()}".

Question: ${plain(c.q)}
Reference answer on the card: ${plain(c.a)}
${c.simple ? "Plain-words explanation (context, not required in the answer): " + plain(c.simple) + "\n" : ""}${c.perspective ? "Big picture (context, not required): " + plain(c.perspective) + "\n" : ""}
The student's answer, in their own words:
"""${own.slice(0, 4000)}"""

Judge whether the student captured the essence of the card, as an exam marker would. First work out the 2 to 5 key ideas a correct answer must contain, based on the reference answer. For a list or framework question, each item is a key idea. Paraphrases, synonyms, a different order and the student's own examples are all fine; the wording does not need to match. Do not give credit for vague statements that only repeat the question. List any statement that is wrong or that confuses this concept with a neighbouring one.

Reply with only JSON:
{"verdict":"correct|partial|missing","score":0,"keyIdeas":[{"idea":"short phrase","covered":true}],"errors":["..."],"feedback":"2 to 3 sentences to the student: what was good, exactly what to add or fix, and one tip to remember it","suggestedRating":1,${langSpec(true)}}

score: 0 to 100, the share of the essence captured. suggestedRating: 4 = every key idea, precise; 3 = every key idea but imprecise, or a minor gap; 2 = about half of the key ideas; 1 = most missing or wrong. Write keyIdeas, errors and feedback in the same language as the student's answer.

${LANG_RULES}`;
  try {
    const r = await S.sample.json(prompt, { signal: gradeCtl.signal, cache: false });
    S.grade = { id: c.id, result: cleanGrade(r) };
  } catch (e) {
    S.grade = e?.code === "cancelled" ? null : { id: c.id, error: aiErrorText(e) };
  }
  if (S.view === "study" && S.cur === c.id) render();
}

function answerHtml(a) {

function md(t) {
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>").split("\n");
  let html = "", inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);
    if (m) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${m[1]}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (l.trim()) html += `<p>${l.replace(/^#+\s*/, "")}</p>`;
  }
  return html + (inList ? "</ul>" : "");
}

function sessionBar() {

  const counts = [1, 2, 3, 4].map((r) => list.filter((c) => S.prog[c.id]?.last === r).length);
  const nFlag = S.cards.filter((c) => S.flags.has(c.id)).length;
  const modes = [["due", "Due cards"], ["status", "By status"], ["weak", "By confidence"], ["all", "All cards"], ["straight", "Straight through"], ["random", "Random · no pressure"], ["flagged", `Flagged (${nFlag})`]];
  return `<section class="session" aria-label="Session settings">
    <div class="seg">${modes.map(([k, l]) => `<button data-mode="${k}" aria-pressed="${ss.mode === k}">${l}</button>`).join("")}</div>
    ${ss.mode === "weak" ? `<div class="levels"><span class="note">Cards I last rated:</span>${[1, 2, 3, 4].map((r) => `<button class="lvl ${["again", "hard", "good", "easy"][r - 1]}" data-level="${r}" aria-pressed="${ss.levels.includes(r)}">${LEVELS[r - 1]}<b>${counts[r - 1]}</b></button>`).join("")}</div>` : ""}
    ${ss.mode === "status" ? `<div class="levels"><span class="note">Cards that are:</span>${STATUSES.map(([k, l]) => `<button class="lvl st-${k}" data-status="${k}" aria-pressed="${ss.statuses.includes(k)}">${l}<b>${list.filter((c) => hasStatus(c.id, k)).length}</b></button>`).join("")}</div>` : ""}
    ${ss.mode === "straight" ? `<div class="row"><span class="note">Every card once, in order. Ratings don't change your schedule; they sort cards into four groups.</span>${S.cur ? `<button class="link" id="st-toggle">${S.stShow ? "Hide" : "Show"} my results</button>` : ""}</div>${S.cur && S.stShow ? stResults(false) : ""}` : ""}
    <div class="session-opts">
      <label for="s-shuffle"><input type="checkbox" id="s-shuffle" ${ss.shuffle ? "checked" : ""}> Shuffle</label>
      <label for="s-count"><input type="checkbox" id="s-count" ${ss.count ? "checked" : ""}> Ratings update my schedule</label>
      <span class="note">${S.total} card${S.total === 1 ? "" : "s"} · ${esc(deckLabel())}</span>
    </div></section>`;
}
function renderDone() {
  const list = inDeck(), now = Date.now(), ss = S.session;
  const next = list.map((c) => S.prog[c.id]?.due).filter((d) => d && d > now).sort((a, b) => a - b)[0];
  let title = S.done ? "Session complete" : "Nothing due right now";
  let msg = (S.done ? `You reviewed ${S.done} card${S.done === 1 ? "" : "s"}. ` : "") + (next ? `The next card comes back in <b>${fmtIv(next - now)}</b>.` : "Every card in this deck has been scheduled.");
  if (!S.done && !S.practice && ss.mode === "weak") {
    title = ss.levels.length ? "No cards match" : "Pick a confidence level";
    msg = ss.levels.length ? `No cards in ${isAll() ? "your weeks" : esc(deckLabel())} are currently rated ${ss.levels.map((r) => LEVELS[r - 1]).join(" or ")}. Rate some cards first, or pick other levels above.` : "Choose which confidence levels you want to study above.";
  }
  if (!S.done && !S.practice && ss.mode === "status") {
    const names = ss.statuses.map((k) => STATUSES.find(([x]) => x === k)?.[1].toLowerCase()).filter(Boolean);
    title = names.length ? "No cards match" : "Pick a status";
    msg = names.length ? `No cards in ${isAll() ? "your weeks" : esc(deckLabel())} are ${names.join(" or ")} right now. Pick other statuses above.` : "Choose which statuses you want to study above.";
  }
  if (!S.done && !S.practice && ss.mode === "flagged") {
    title = "No flagged cards";
    msg = "Flag cards from your mock exam results, or with the Flag button on any card. Flagged mode includes every week.";
  }
  if (ss.mode === "straight" || S.stRun) {
    $("main").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${sessionBar()}<div class="done">
      <h2>${S.done ? "You went through everything" : "Straight through"}</h2>
      <p>${S.done ? `You rated ${S.done} card${S.done === 1 ? "" : "s"}. Here is how they split. Start with No idea and Shaky.` : "Your results are below."}</p>
      <div class="row"><button class="btn" id="refresh">Go through ${esc(isAll() ? "all weeks" : deckLabel())} again</button></div></div>
      ${stResults(true)}</div>`;
    return;
  }
  $("main").innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${sessionBar()}<div class="done">
    <h2>${title}</h2>
    <p>${msg}</p>
    <div class="row">
      <button class="btn primary" id="refresh">Check for due cards</button>
      <button class="btn" id="practice">Practice all ${list.length} anyway</button>
    </div>
    <p class="note">A practice round shuffles the whole deck without changing when cards are due.</p>
  </div></div>`;
}

/* ---------- card text formatting: **bold**, *italic*, __underline__, ==highlight== ---------- */
function fmt(text) {
  return esc(text)
    .replace(/\*\*(?=\S)([^\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/__(?=\S)([^\n]+?)__/g, "<u>$1</u>")
    .replace(/==(?=\S)([^\n]+?)==/g, '<mark class="hi">$1</mark>')
    .replace(/(^|[^*\w])\*(?=\S)([^*\n]+?)\*(?![*\w])/g, "$1<em>$2</em>");
}
function plain(text) {
  return String(text ?? "").replace(/\*\*(?=\S)([^\n]+?)\*\*/g, "$1").replace(/__(?=\S)([^\n]+?)__/g, "$1").replace(/==(?=\S)([^\n]+?)==/g, "$1")
    .replace(/(^|[^*\w])\*(?=\S)([^*\n]+?)\*(?![*\w])/g, "$1$2");
}
const FMT = { bold: "**", italic: "*", underline: "__", highlight: "==" };
function replaceRange(ta, a, b, text) {
  ta.focus(); ta.setSelectionRange(a, b);
  let ok = false;
  try { ok = document.execCommand("insertText", false, text); } catch {}
  if (!ok) ta.value = ta.value.slice(0, a) + text + ta.value.slice(b);
}
function applyFmt(kind) {
  const ta = $(S.fmtField || "f-a"); if (!ta) return;
  const v = ta.value; let a = ta.selectionStart, b = ta.selectionEnd;
  if (kind === "clear") {
    if (a === b) { a = 0; b = v.length; }
    const t = plain(v.slice(a, b)); replaceRange(ta, a, b, t); ta.setSelectionRange(a, a + t.length); updatePreview(); return;
  }
  const m = FMT[kind];
  if (a === b) {  // no selection: use the word under the cursor
    while (a > 0 && /\S/.test(v[a - 1])) a--;
    while (b < v.length && /\S/.test(v[b])) b++;
  }
  // trim surrounding spaces from the selection so markers hug the words
  while (a < b && /\s/.test(v[a])) a++;
  while (b > a && /\s/.test(v[b - 1])) b--;
  if (a === b) { replaceRange(ta, a, b, m + m); ta.setSelectionRange(a + m.length, a + m.length); updatePreview(); return; }
  const sel = v.slice(a, b);
  const outer = v.slice(a - m.length, a) === m && v.slice(b, b + m.length) === m && !(kind === "italic" && (v[a - 2] === "*" || v[b + 1] === "*"));
  if (outer) {  // already formatted: remove the markers around the selection
    replaceRange(ta, a - m.length, b + m.length, sel); ta.setSelectionRange(a - m.length, b - m.length);
  } else if (sel.startsWith(m) && sel.endsWith(m) && sel.length > 2 * m.length) {  // selection includes the markers
    const inner = sel.slice(m.length, -m.length); replaceRange(ta, a, b, inner); ta.setSelectionRange(a, a + inner.length);
  } else {
    const wrapped = sel.split("\n").map((l) => (l.trim() ? l.replace(/^(\s*)(.*?)(\s*)$/, `$1${m}$2${m}$3`) : l)).join("\n");
    replaceRange(ta, a, b, wrapped);
    if (!sel.includes("\n")) ta.setSelectionRange(a + m.length, b + m.length); else ta.setSelectionRange(a, a + wrapped.length);
  }
  updatePreview();
}
function updatePreview() {
  const box = $("fmt-preview"), ta = $(S.fmtField || "f-a"); if (!box || !ta) return;
  const label = ta.closest("label")?.firstChild?.textContent?.trim() || "field";
  box.innerHTML = ta.value.trim() ? `<b>Preview of ${esc(label)}:</b> ${fmt(ta.value)}` : `<b>Preview of ${esc(label)}:</b> empty`;
}

const SEARCH_FIELDS = [["q", "Question"], ["a", "Answer"], ["simple", "In plain words"], ["example", "Example"], ["perspective", "Big picture"], ["notes", "My notes"]];
function searchTerms() { return S.search.toLowerCase().split(/\s+/).filter(Boolean); }
function matchesSearch(c, terms) {
  if (!terms.length) return true;
  const t = SEARCH_FIELDS.map(([k]) => c[k] || "").concat(c.deck || "").join(" \n ").toLowerCase();
  return terms.every((x) => t.includes(x));
}
function searchResults() { const terms = searchTerms(); return inDeck().filter((c) => matchesSearch(c, terms)); }
function hl(text, terms) {
  text = String(text ?? "");
  if (!terms.length) return esc(text);
  const re = new RegExp("(" + terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return text.split(re).map((part, i) => (i % 2 ? `<mark>${esc(part)}</mark>` : esc(part))).join("");
}
function snippet(c, terms) {
  for (const [k, label] of SEARCH_FIELDS.slice(1)) {
    const v = plain(c[k]).replace(/\s+/g, " "), low = v.toLowerCase();
    const idx = Math.min(...terms.map((t) => { const i = low.indexOf(t); return i < 0 ? Infinity : i; }));
    if (idx === Infinity) continue;
    const start = Math.max(0, idx - 50);
    const s = (start ? "…" : "") + v.slice(start, start + 170) + (start + 170 < v.length ? "…" : "");
    return (k === "a" ? "" : esc(label) + ": ") + hl(s, terms);
  }
  return hl(plain(c.a).replace(/\s+/g, " "), terms);
}
function renderCards() {
  if (!$("list")) {
    $("main").innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
      <div class="list-tools">
        <div class="search-info" id="search-info"></div>
        ${S.canWrite ? `<button class="btn primary" id="add">Add card</button>` : ""}
      </div>
      <div id="list" class="list"></div>
      <div class="row" id="reset-row"></div>
    </div>`;
  }
  const terms = searchTerms(), list = searchResults();
  const groups = [...new Set(list.map((c) => c.deck))];
  $("search-info").innerHTML = terms.length
    ? `<span><b>${list.length}</b> card${list.length === 1 ? "" : "s"} match “${esc(S.search.trim())}” ${isAll() ? "across all weeks" : `in ${esc(deckLabel())} · <button class="link" id="search-all">search all weeks</button>`}</span>
       ${list.length ? `<button class="btn primary" id="study-matches">Study these ${list.length}</button>` : ""}<button class="btn" id="search-clear">Clear search</button>`
    : `<span class="note">${inDeck().length} cards${isAll() ? " across all weeks" : " in " + esc(deckLabel())}. Use the search bar above to filter by keyword.</span>`;
  $("list").innerHTML = list.length ? groups.map((g) => `<section class="group"><div class="group-head"><h3>${esc(g)} · ${list.filter((c) => c.deck === g).length} cards</h3>${S.canWrite ? `<button class="add-chip" data-add-deck="${esc(g)}">+ Add card to ${esc(g)}</button>` : ""}</div><div class="items">${
    list.filter((c) => c.deck === g).map((c) => { const st = status(c.id); return `<div class="item">
      <div class="t"><div>${hl(plain(c.q), terms)}${S.flags.has(c.id) ? `<span class="pill flag">Flagged</span>` : ""}</div><div>${terms.length ? snippet(c, terms) : esc(plain(c.a))}</div></div>
      <span class="pill ${st.k}">${esc(st.label)}</span>
      <button class="icon-btn" data-edit="${esc(c.id)}">${S.canWrite ? "Edit" : "View"}</button></div>`; }).join("")}</div></section>`).join("")
    : `<div class="empty-state">No cards match “${esc(S.search.trim())}”${isAll() ? "" : " in " + esc(deckLabel())}. Try fewer or different keywords.</div>`;
  $("reset-row").innerHTML = S.confirmReset
    ? `<span class="note">Reset the schedule for all ${inDeck().length} cards in this view? They'll all be new again.</span><button class="btn danger" id="reset-yes">Reset</button><button class="btn" id="reset-no">Cancel</button>`
    : `<button class="btn" id="reset">Reset study progress</button>`;
}

/* ---------- straight-through results ---------- */
let stSaving = null, stDirty = false;
function saveSt() {
  if (!(S.db && S.uid)) { lsSet("fcm-straight", S.st); return; }
  if (stSaving) { stDirty = true; return; }
  stSaving = S.db.doc("data/users/" + S.uid + "/meta").collection("state").doc("straight").set({ ratings: { ...S.st }, updatedAt: Date.now() })
    .catch(() => {}).finally(() => { stSaving = null; if (stDirty) { stDirty = false; saveSt(); } });
}
function stResults(open) {
  const list = inDeck().filter((c) => S.st[c.id]);
  const total = inDeck().length;
  const cls = ["again", "hard", "good", "easy"];
  if (!list.length) return `<section class="session st-res"><h3>Straight-through results</h3><p class="note">Go straight through ${esc(isAll() ? "all weeks" : deckLabel())} and your ratings will be sorted into four groups here, without touching your schedule.</p></section>`;

    <div class="st-grid">${[1, 2, 3, 4].map((r) => { const cs = list.filter((c) => S.st[c.id] === r);
      return `<div class="st-box ${cls[r - 1]}"><div class="st-top"><b>${LEVELS[r - 1]}</b><span class="st-n">${cs.length}</span></div>
        ${cs.length ? `<button class="btn" data-st-study="${r}">Study these ${cs.length}</button>
        <details ${open && r <= 2 ? "open" : ""}><summary>Show cards</summary><ul>${cs.map((c) => `<li><button class="link" data-st-one="${esc(c.id)}">${esc(plain(c.q))}</button> <span class="note">${esc(c.deck)}</span></li>`).join("")}</ul></details>` : `<span class="note">None</span>`}</div>`; }).join("")}</div>
    <div class="row">${list.some((c) => S.st[c.id] <= 2) ? `<button class="btn primary" data-st-study="12">Study all No idea + Shaky</button>` : ""}
      ${S.stClear ? `<span class="note">Clear the results for ${esc(isAll() ? "all weeks" : deckLabel())}?</span><button class="btn danger" id="st-clear-yes">Clear</button><button class="btn" id="st-clear-no">Cancel</button>` : `<button class="link" id="st-clear">Clear results</button>`}</div>
    <p class="note">When you study a group, your new ratings move the cards between groups. Your schedule is never changed here.</p></section>`;
}
function stClick(t) {
  if (t.dataset.stStudy) { const k = t.dataset.stStudy, want = k === "12" ? [1, 2] : [+k];
    const ids = inDeck().filter((c) => want.includes(S.st[c.id])).map((c) => c.id); if (!ids.length) return true;
    startCustom(ids); S.practice = true; S.straight = true; S.stRun = true; S.view = "study"; render(); window.scrollTo(0, 0); return true; }
  if (t.dataset.stOne) { openEditor(t.dataset.stOne); return true; }
  if (t.id === "st-toggle") { S.stShow = !S.stShow; render(); return true; }
  if (t.id === "st-clear") { S.stClear = true; render(); return true; }
  if (t.id === "st-clear-no") { S.stClear = false; render(); return true; }
  if (t.id === "st-clear-yes") { for (const c of inDeck()) delete S.st[c.id]; S.stClear = false; saveSt(); render(); return true; }
  return false;
}

/* ---------- overview ---------- */
let ovCtl = null;
function startPractice(ids) {
  startCustom(ids); S.practice = true; S.straight = true; S.view = "study"; render(); window.scrollTo(0, 0);
}
function cleanOverview(r) {
  const ids = new Set(S.cards.map((c) => c.id)), ds = decks(), str = (x) => typeof x === "string" ? x.trim() : "";
  const lectures = (Array.isArray(r?.lectures) ? r.lectures : []).filter((l) => ds.includes(l?.deck)).map((l) => ({
    deck: l.deck, title: str(l.title), summary: str(l.summary), leadsTo: str(l.leadsTo),
    concepts: (Array.isArray(l.concepts) ? l.concepts : []).map((c) => ({ name: str(c?.name), cardIds: (Array.isArray(c?.cardIds) ? c.cardIds : []).map(String).filter((id) => ids.has(id)).slice(0, 6) })).filter((c) => c.name).slice(0, 12) }))
    .sort((a, b) => ds.indexOf(a.deck) - ds.indexOf(b.deck));
  const threads = (Array.isArray(r?.threads) ? r.threads : []).map((t) => ({ name: str(t?.name), how: str(t?.how), decks: (Array.isArray(t?.decks) ? t.decks : []).filter((d) => ds.includes(d)) })).filter((t) => t.name).slice(0, 8);
  const links = (Array.isArray(r?.links) ? r.links : []).map((l) => ({ from: str(l?.from), fromDeck: str(l?.fromDeck), to: str(l?.to), toDeck: str(l?.toDeck), how: str(l?.how),
    cardIds: (Array.isArray(l?.cardIds) ? l.cardIds : []).map(String).filter((id) => ids.has(id)).slice(0, 6) })).filter((l) => l.from && l.to).slice(0, 20);
  if (!lectures.length) throw { code: "invalid_json" };
  return { bigPicture: str(r?.bigPicture), lectures, threads, links, createdAt: Date.now(), cardCount: S.cards.length };
}
async function generateOverview() {
  if (!S.sample) { S.ovMsg = "Creating the overview needs Claude, which isn't available in this view."; render(); return; }
  ovCtl?.abort(); ovCtl = new AbortController();
  S.ovBusy = true; S.ovMsg = ""; render();
  const ds = decks();
  const cardsTxt = S.cards.map((c) => `[${c.id}] (${c.deck}) Q: ${plain(c.q)} | A: ${plain(c.a).replace(/\s+/g, " ").slice(0, 320)}`).join("\n");
  const prompt = `You are an excellent university tutor. A student preparing for the exam of the course "${COURSE()}" feels lost and wants one clear overview of the whole course: what each week is about and how all the concepts connect.

Here are all the course's flash cards (id in brackets, week in parentheses):
${cardsTxt}

Write:
- "bigPicture": 4 to 6 sentences telling the story of the whole course from the first week to the last, so the student sees why the weeks come in this order.
- "lectures": one entry per week (${ds.join(", ")}), each with "deck" (exactly as written above), "title" (3 to 6 words naming its theme), "summary" (3 to 5 plain sentences with the core ideas), "concepts" (5 to 10 key concepts, each {"name","cardIds"} with the ids of the cards that cover it), and "leadsTo" (one sentence on how it sets up or connects to the next week; empty for the last).
- "threads": 3 to 6 themes that run through several weeks, each {"name","decks":[week names],"how":"2 to 3 sentences on how the theme develops across those weeks"}.
- "links": 8 to 14 of the most useful connections between concepts from DIFFERENT weeks, especially ones an exam could combine, each {"from","fromDeck","to","toDeck","how":"one or two sentences on how they relate","cardIds":[ids of the cards for both concepts]}.

Use the course's own terms, be accurate to the cards, write clearly for a stressed student, in English. Use only ids from the list.
Reply with only JSON: {"bigPicture":"...","lectures":[...],"threads":[...],"links":[...]}`;
  try {
    const r = await S.sample.json(prompt, { signal: ovCtl.signal, cache: false, modelTier: "complex" });
    const ov = cleanOverview(r);
    S.overview = ov;
    if (S.db && S.canWrite) { try { await S.db.collection("overview").doc("main").set(ov); } catch {} }
  } catch (e) { S.ovMsg = e?.code === "cancelled" ? "" : aiErrorText(e); }
  S.ovBusy = false; render();
}
function renderOverview() {
  if (!S.overview && S.ovRaw && S.cards.length) { try { S.overview = { ...cleanOverview(S.ovRaw), createdAt: S.ovRaw.createdAt || Date.now(), cardCount: S.ovRaw.cardCount || S.cards.length }; } catch {} }
  const O = S.overview, chip = (c) => `<button class="chip" data-ov-ids="${esc(c.cardIds.join(","))}" ${c.cardIds.length ? "" : "disabled"} title="${c.cardIds.length ? "Practise the cards for this concept (no pressure)" : ""}">${esc(c.name)}${c.cardIds.length ? `<b>${c.cardIds.length}</b>` : ""}</button>`;
  const deckNo = (d) => (d.match(/\d+$/) || [d])[0];
  const head = `<div class="intro"><h2>Course overview</h2><p class="note">What each week is about and how the concepts connect. Tap a concept to practise its cards without affecting your schedule.</p></div>
    ${S.ovMsg ? `<div class="review-msg" role="status" style="background:var(--again-soft);color:var(--again)">${esc(S.ovMsg)}</div>` : ""}`;
  const busy = S.ovBusy ? `<div class="row"><span class="note">Claude is reading all ${S.cards.length} cards and writing your overview… this takes 1 to 3 minutes.</span><button class="icon-btn" id="ov-stop">Stop</button></div>` : "";
  if (!O) {

  $("main").innerHTML = `<div class="ov">${head}
    <div class="ov-big"><b>The big picture</b><p>${esc(O.bigPicture)}</p></div>
    <div class="ov-map" aria-label="Course map">${O.lectures.map((l, i) => `<div class="ov-step">${i ? `<span class="ov-arrow" aria-hidden="true">→</span>` : ""}<button class="ov-node" data-ov-jump="${i}"><b>${esc(l.deck)}</b>${esc(l.title)}</button></div>`).join("")}</div>
    ${O.lectures.map((l, i) => `<section class="ov-lec" id="ov-lec-${i}"><h3><span>${esc(l.deck)}</span>${esc(l.title)}</h3><p>${esc(l.summary)}</p>
      <div class="ov-chips">${l.concepts.map(chip).join("")}</div>
      ${l.leadsTo ? `<div class="ov-next">→ ${esc(l.leadsTo)}</div>` : ""}</section>`).join("")}
    ${O.threads.length ? `<section class="group"><div class="group-head"><h3>Themes running through the course</h3></div><div class="ov-list">${O.threads.map((t) => `<div class="ov-link"><div class="ends">${esc(t.name)}${t.decks.map((d) => `<span class="pill review">${esc(d)}</span>`).join("")}</div><div class="note">${esc(t.how)}</div></div>`).join("")}</div></section>` : ""}
    ${O.links.length ? `<section class="group"><div class="group-head"><h3>How concepts connect across weeks</h3></div><div class="ov-list">${O.links.map((l) => `<div class="ov-link"><div class="ends">${esc(l.from)} <span class="pill review">${esc(deckNo(l.fromDeck))}</span><span class="ov-arrow" aria-hidden="true">⟷</span>${esc(l.to)} <span class="pill review">${esc(deckNo(l.toDeck))}</span></div><div class="note">${esc(l.how)}</div>${l.cardIds.length ? `<div><button class="link" data-ov-ids="${esc(l.cardIds.join(","))}">Practise these ${l.cardIds.length} cards</button></div>` : ""}</div>`).join("")}</div></section>` : ""}
    <div class="row">${busy || (S.sample && S.canWrite ? `<button class="btn" id="ov-gen">Regenerate overview</button>` : "")}<span class="note">Created ${new Date(O.createdAt).toLocaleDateString([], { day: "numeric", month: "short" })}${newer ? ` · you have ${S.cards.length - O.cardCount > 0 ? "added" : "changed"} cards since, regenerate to include them` : ""}</span></div>
  </div>`;

const aiInstr = () => ($("ai-instr")?.value || "").trim().slice(0, 1500);

The student's instructions: ${instr}

Rewrite only the fields the instructions concern (if they are general, such as "make it shorter", apply them to every field where it helps). Keep the content correct and use the course's terminology. You may use **bold**, *italic*, __underline__ and ==highlight== markup and line breaks starting with "- " for bullet points. Write in the language the card is written in unless the student asks otherwise.

  connect: "Explain how this concept connects to two or three of the other cards in the course listed below, and point out the difference that students most often confuse.",
  quiz: "Write one exam-style question that checks real understanding (not memorisation) of this concept. Then write a line with only '---' and give a short model answer.",

let askCtl = null;

The card being studied (deck: ${c.deck}):
Question: ${c.q}
Answer on the card: ${c.a}
${c.simple ? "Plain-words explanation on the card: " + c.simple + "\n" : ""}${c.example ? "Example on the card: " + c.example + "\n" : ""}
Other cards in the course:
${others}

Task: ${custom ? "Answer the student's question about this card: " + custom : TASKS[kind]}

Keep it under 180 words. Use plain language, short paragraphs or "- " bullets, and **bold** for key terms. If the card itself contains a factual mistake, point it out briefly. No preamble.`;
  try {

function renameCourse() {
  const b = $("sub"); if (!b || b.disabled) return;
  const inp = document.createElement("input");
  inp.id = "sub-input"; inp.value = S.course; inp.placeholder = "Course name"; inp.maxLength = 80; inp.setAttribute("aria-label", "Course name");
  inp.style.cssText = "font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 8px;";
  b.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true;
    const name = inp.value.trim();
    inp.replaceWith(b);
    if (save && name !== S.course) { S.course = name; try { await S.db.doc("settings/course").set({ name, updatedAt: Date.now() }); } catch {} }
    renderSub();
  };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); finish(true); } else if (e.key === "Escape") finish(false); e.stopPropagation(); });
  inp.addEventListener("blur", () => finish(true));
}

document.addEventListener("click", (e) => {

  if (t.dataset.flag) { toggleFlag(t.dataset.flag); render(); return; }
  if (t.id === "sub") { renameCourse(); return; }
  if (t.id === "tab-exam") { S.view = "exam"; render(); return; }
  if (t.id === "tab-overview") { S.view = "overview"; render(); return; }

  if (examClick(t)) return;
  if (t.id === "zoom-close") { closeEditor(); return; }
  if (t.id === "search-clear") { S.search = ""; $("search").value = ""; renderCards(); $("search").focus(); return; }
  if (t.id === "search-all") { S.decks = []; saveDecks(); buildQueue(); $("main").innerHTML = ""; render(); return; }
  if (t.id === "study-matches") { startCustom(searchResults().map((c) => c.id)); S.view = "study"; render(); return; }
  if (t.id === "ai-improve") { aiImprove(); return; }
  if (t.id === "ai-rewrite") { aiRewrite(); return; }
  if (t.id === "ai-apply-all") { document.querySelectorAll("[data-ai-apply]").forEach((b) => { if (!b.disabled) applySuggestion(+b.dataset.aiApply, b); }); t.textContent = "All applied"; t.disabled = true; return; }
  if (t.id === "ai-diagram") { S.aiIdea = ""; aiDiagram(""); return; }
  if (t.id === "ai-stop") { aiCtl?.abort(); return; }
  if (t.dataset.aiApply !== undefined) { applySuggestion(+t.dataset.aiApply, t); return; }
  if (t.dataset.aiDraw !== undefined) { const s = S.aiSugs[+t.dataset.aiDraw]; S.aiIdea = s ? `${s.title}. ${s.why}` : ""; aiDiagram(S.aiIdea); return; }
  if (t.id === "ai-dia-add") { addDiagram(t); return; }
  if (t.id === "ai-dia-again") { aiDiagram(S.aiIdea); return; }
  if (t.dataset.mode) { S.session.mode = t.dataset.mode; saveSession(); buildQueue(); render(); return; }
  if (t.dataset.status) { const k = t.dataset.status, L = S.session.statuses || []; S.session.statuses = L.includes(k) ? L.filter((x) => x !== k) : [...L, k]; saveSession(); buildQueue(); render(); return; }
  if (t.dataset.stat) { S.session.mode = "status"; S.session.statuses = [t.dataset.stat]; saveSession(); buildQueue(); S.view = "study"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.level) { const r = +t.dataset.level, L = S.session.levels; S.session.levels = L.includes(r) ? L.filter((x) => x !== r) : [...L, r].sort(); saveSession(); buildQueue(); render(); return; }
  if (t.id === "ed-addimg") { $("f-img").click(); return; }
  if (t.dataset.rmImg !== undefined) { S.edImages.splice(+t.dataset.rmImg, 1); renderEdImgs(); return; }
  if (t.id === "tab-study") { S.view = "study"; S.confirmReset = false; render(); }
  else if (t.id === "tab-cards") { S.view = "cards"; $("main").innerHTML = ""; render(); }
  else if (t.id === "tab-review") { S.view = "review"; S.reviewMsg = ""; render(); }
  else if (t.dataset.approve) { const id = t.dataset.approve, p = S.proposals.find((x) => x.id === id); t.disabled = true; approveProp(id).then((ok) => { if (ok) S.reviewMsg = "Added to " + p.deck + "."; render(); }); }
  else if (t.dataset.approveAll) { t.disabled = true; approveAll(t.dataset.approveAll); }
  else if (t.dataset.editProp) { const p = S.proposals.find((x) => x.id === t.dataset.editProp); if (p) openEditor(null, p.deck, p, p.id); }
  else if (t.dataset.reject) setPropStatus(t.dataset.reject, "rejected", "Suggestion rejected. You can restore it below.");
  else if (t.dataset.restore) setPropStatus(t.dataset.restore, "pending", "Suggestion restored.");
  else if (t.dataset.toggleProp) { S.openProp[t.dataset.toggleProp] = !S.openProp[t.dataset.toggleProp]; render(); }
  else if (t.id === "toggle-rej") { S.showRejected = !S.showRejected; render(); }
  else if (t.dataset.deck) { toggleDeck(t.dataset.deck); S.confirmReset = false; buildQueue(); if (S.view === "cards") $("main").innerHTML = ""; render(); }
  else if (t.id === "card" || t.id === "show") flip();
  else if (t.dataset.rate) rate(+t.dataset.rate);
  else if (t.dataset.more) { S.moreTab = t.dataset.more; render(); }
  else if (t.dataset.ask) ask(t.dataset.ask);
  else if (t.id === "ask-stop") askCtl?.abort();
  else if (t.id === "ask-save") saveAnswerToNotes(t);
  else if (t.id === "edit-cur") { e.stopPropagation(); openEditor(S.cur); }
  else if (t.dataset.edit) openEditor(t.dataset.edit);
  else if (t.id === "add") openEditor(null);
  else if (t.dataset.addDeck !== undefined) openEditor(null, t.dataset.addDeck);
  else if (t.id === "refresh") { buildQueue(); render(); }
  else if (t.id === "practice") { buildQueue(true); render(); }
  else if (t.id === "reset") { S.confirmReset = true; render(); }
  else if (t.id === "reset-no") { S.confirmReset = false; render(); }
  else if (t.id === "reset-yes") { S.confirmReset = false; clearProg(inDeck().map((c) => c.id)).then(() => { buildQueue(); render(); }); }
  else if (t.id === "ed-cancel") closeEditor();
  else if (t.id === "ed-delete") deleteCard($("editor").dataset.id, t);
  else if (t.id === "ed-resetone") { const id = $("editor").dataset.id; clearProg([id]).then(() => { t.remove(); render(); }); }
});
document.addEventListener("mousedown", (e) => {
  if (e.target.id === "scrim") closeEditor();
  if (e.target.closest("[data-fmt]")) e.preventDefault();  // keep the text selection in the field
});
document.addEventListener("focusin", (e) => {
  if (e.target.tagName === "TEXTAREA" && e.target.id !== "ai-instr" && e.target.closest("#editor")) { S.fmtField = e.target.id; updatePreview(); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "editor") saveEditor();
  else if (e.target.id === "ask-form") { const v = $("ask-input").value.trim(); if (v) { ask(null, v); $("ask-input").value = ""; } }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "own-lang") { try { localStorage.setItem("fcm-dictlang", e.target.value); } catch {} if (dict) { stopDictation(); dictMsg("Language changed. Press Dictate again."); } return; }
  if (e.target.id === "f-img") { uploadImage(e.target.files[0]); e.target.value = ""; }
  else if (e.target.id === "s-shuffle" || e.target.id === "s-count") {
    S.session[e.target.id === "s-shuffle" ? "shuffle" : "count"] = e.target.checked;
    saveSession(); buildQueue(); render();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.tagName === "TEXTAREA" && e.target.closest("#editor")) { updatePreview(); return; }
  if (e.target.id === "own") { if (S.cur) S.own[S.cur] = e.target.value; if ($("own-msg")) $("own-msg").textContent = ""; return; }
  if (e.target.id !== "search") return;
  S.search = e.target.value;
  if (S.view !== "cards") { S.view = "cards"; S.confirmReset = false; $("main").innerHTML = ""; render(); }
  else renderCards();
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "ai-instr" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); aiRewrite(); return; }
  if (e.target.tagName === "TEXTAREA" && e.target.id !== "ai-instr" && e.target.closest("#editor") && (e.metaKey || e.ctrlKey)) {
    const k = e.key.toLowerCase(), kind = e.shiftKey ? (k === "h" ? "highlight" : null) : { b: "bold", i: "italic", u: "underline" }[k];
    if (kind) { e.preventDefault(); S.fmtField = e.target.id; applyFmt(kind); return; }
  }
  if ($("scrim")) { if (e.key === "Escape") closeEditor(); return; }
  if (e.target.id === "own" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); checkOwn(); return; }
  if (e.target.id === "own" && e.key === "Escape") { e.target.blur(); return; }
  if (e.target.id === "search" && e.key === "Escape") { S.search = ""; e.target.value = ""; if (S.view === "cards") renderCards(); e.target.blur(); return; }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.metaKey && !e.ctrlKey) { e.preventDefault(); $("search").focus(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || S.view !== "study" || e.metaKey || e.ctrlKey) return;
  if ((e.key === " " || e.key === "Enter") && !S.flipped && S.cur) { e.preventDefault(); flip(); }
  else if (S.flipped && ["1", "2", "3", "4"].includes(e.key)) rate(+e.key);
});

/* ---------- boot ---------- */
(async function boot() {
  render();
  const C = window.claude;
  const [db, user, sample, assets] = C ? await Promise.all([C.use("db"), C.use("user"), C.use("sample"), C.use("assets")]) : [null, null, null, null];
  S.db = db; S.sample = sample; S.assets = assets;
  if (user) { S.uid = await user.id(); const w = await user.can("data.write"); S.canWrite = w !== false; }
  renderSub();
  if (!db) {
    S.cardsLoaded = true; S.canWrite = false;
    $("main").innerHTML = `<div class="empty-state"><h2>Your cards live on claude.ai</h2>Open this page on claude.ai while signed in to study and edit your decks.</div>`;
    return;
  }
  db.collection("cards").onSnapshot((snap) => {
    S.cards = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => String(a.deck).localeCompare(String(b.deck), undefined, { numeric: true }) || (a.order || 0) - (b.order || 0));
    S.cardsLoaded = true; maybeStart();
  }, () => { S.cardsLoaded = true; render(); });
  db.collection("proposals").onSnapshot((snap) => {
    S.proposals = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => String(a.deck).localeCompare(String(b.deck), undefined, { numeric: true }) || (a.order || 0) - (b.order || 0));
    S.propLoaded = true; renderBar(); if (S.view === "review") render();
  }, () => { S.propLoaded = true; });
  db.collection("overview").doc("main").onSnapshot((snap) => {
    if (snap.exists) { S.ovRaw = snap.data(); S.overview = null; }
    if (S.view === "overview") render();
  }, () => {});
  db.doc("settings/course").onSnapshot((snap) => {
    S.course = snap.exists ? String(snap.data().name || "") : ""; renderSub();
  }, () => {});
  db.collection("mockexams").onSnapshot((snap) => {
    S.ex.official = snap.docs.map((d) => ({ id: d.id, ...d.data(), official: true })).sort((a, b) => (a.order || 0) - (b.order || 0));
    if (S.view === "exam" && !S.ex.cur) render();
  }, () => {});
  if (S.uid) {
    const base = db.doc("data/users/" + S.uid + "/meta");
    base.collection("exams").onSnapshot((snap) => {
      S.ex.mine = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (S.view === "exam" && !S.ex.cur) render();
    }, () => {});
    base.collection("attempts").onSnapshot((snap) => {
      const m = {}; snap.docs.forEach((d) => { m[d.id] = d.data(); }); S.ex.attempts = m;
      if (S.view === "exam" && !S.ex.cur) render();
    }, () => {});
    base.collection("state").doc("straight").onSnapshot((snap) => {
      if (stSaving || stDirty) return;
      S.st = snap.exists ? { ...(snap.data().ratings || {}) } : {};
      if (S.cardsLoaded && (S.view === "study" && (!S.cur || S.session.mode === "straight"))) render();
    }, () => {});
    base.collection("state").doc("flags").onSnapshot((snap) => {
      S.flags = new Set(snap.exists ? (snap.data().ids || []) : []);
      if (S.cardsLoaded) render();
    }, () => {});
  } else {
    S.ex.mine = lsGet("fcm-exams", []); S.ex.attempts = lsGet("fcm-attempts", {}); S.flags = new Set(lsGet("fcm-flags", [])); S.st = lsGet("fcm-straight", {});
  }
  if (S.uid) {
    db.collection("data/users/" + S.uid).onSnapshot((snap) => {
      const remote = {}; snap.docs.forEach((d) => { remote[d.id] = d.data(); });
      S.prog = remote; S.progLoaded = true;
      if (S.started && S.view === "study") renderBar(); else maybeStart();
    }, () => { loadLocalProg(); S.progLoaded = true; maybeStart(); });
  } else { loadLocalProg(); S.progLoaded = true; maybeStart(); }
})();
</script>
